# pnpm settings file. pnpm >= 12 reads settings from here, not from a "pnpm"
# key in package.json. No `packages:` key on purpose: this repo is a
# NestJS-native monorepo with a single root package.json, not a pnpm workspace.

# pnpm blocks dependency build scripts by default; only the ones that ship a
# platform-native binary the project actually needs are allowed explicitly.
allowBuilds:
  '@swc/core': true        # SWC compiler binary (build + tests)
  '@prisma/engines': true  # Prisma CLI engines (schema/migrations, dev only)
  prisma: false            # its postinstall only generates a client we never use
  '@scarf/scarf': false
  esbuild: false
  msgpackr-extract: false
  workerd: false
